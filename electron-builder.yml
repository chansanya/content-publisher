appId: com.ftppublisher.app
productName: 内容发布工具
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - "!**/*.map"
  - "!dist/renderer/**/*.md"
extraFiles:
  - from: .env.example
    to: .env.example
extraResources:
  - from: resources/deploy.php
    to: deploy.php
compression: normal
win:
  # 跳过 rcedit 写版本信息/签名：免下载 winCodeSign（其内置 macOS symlink 在非管理员/非开发者模式下解压必失败）
  # 代价：exe 属性页显示 Electron 默认版本信息，不影响功能
  signAndEditExecutable: false
  # 平台级兜底名：无专属节的 target 使用（当前仅 zip 吃这口）
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # 安装版专属名
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  differentialPackage: false
portable:
  # 单文件版专属名（解锁 win 级兜底，让 zip 独享）
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
mac:
  # M 芯片单架构；identity: null 显式跳过签名（无 Apple 开发者账号，首次打开需右键放行）
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
